server:
  port: 8080

spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
          filters:
            - TokenRelay=
        - id: ticket-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/**
          filters:
            - TokenRelay=

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          #jwk-set-uri: http://localhost:8081/.well-known/jwks.json