server:
  port: 8080

spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true # ¡Activamos los Virtual Threads!

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: lb://auth-service # 'lb' es para load balancer, lo usaremos con el service discovery más adelante
          predicates:
            - Path=/api/v1/auth/**
        - id: ticket-service-route
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/tickets/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081 # El auth-service correrá en el 8081